<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiszki Chiński → Polski · Tylko nieznane się powtarzają</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f5f3f0 0%, #e8e4de 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app-container {
            max-width: 860px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 56px;
            padding: 32px 28px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        h1 {
            font-size: 2.0rem;
            font-weight: 600;
            color: #2c2b28;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(0,0,0,0.05);
        }
        h1 i { color: #b3523a; }
        .flashcard {
            background: #ffffff;
            border-radius: 48px;
            padding: 48px 28px 36px;
            box-shadow: inset 0 -6px 0 #d9d2c9, 0 16px 32px -8px rgba(0,0,0,0.10);
            margin-bottom: 28px;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.6);
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .flashcard:active { transform: scale(0.98); }
        .flashcard .word {
            font-size: 3.4rem;
            font-weight: 600;
            color: #1f1e1b;
            line-height: 1.3;
            word-break: break-word;
        }
        .flashcard .translation-hint {
            font-size: 1.2rem;
            color: #7f7a72;
            margin-top: 12px;
            opacity: 0.7;
        }
        .flashcard .audio-btn {
            margin-top: 24px;
            background: #f0ede8;
            border: none;
            border-radius: 60px;
            padding: 10px 26px;
            font-size: 1.3rem;
            color: #3d3a35;
            box-shadow: 0 4px 0 #cbc4bb;
            cursor: pointer;
            transition: 0.08s linear;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        .flashcard .audio-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #cbc4bb;
        }
        .flashcard .audio-btn i { font-size: 1.6rem; }
        .flashcard .card-number {
            position: absolute;
            top: 16px;
            right: 24px;
            font-size: 0.9rem;
            color: #b0a89d;
            font-weight: 500;
        }
        .flashcard .side-label {
            position: absolute;
            top: 16px;
            left: 24px;
            font-size: 0.8rem;
            color: #b0a89d;
            font-weight: 600;
            background: #f0ede8;
            padding: 4px 14px;
            border-radius: 40px;
            letter-spacing: 0.5px;
        }
        .flashcard .status-badge {
            position: absolute;
            bottom: 16px;
            right: 24px;
            font-size: 0.7rem;
            color: #b0a89d;
            background: #f0ede8;
            padding: 2px 12px;
            border-radius: 40px;
        }
        .btn-action {
            background: transparent;
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f0ede8;
            box-shadow: 0 4px 0 #d2cbc2;
            transition: 0.08s linear;
            cursor: pointer;
            color: #2f2d29;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .btn-action:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #d2cbc2;
        }
        .btn-know {
            background: #d4e2d4;
            box-shadow: 0 4px 0 #a7bda7;
            color: #1f3a1f;
        }
        .btn-dontknow {
            background: #f0d6d0;
            box-shadow: 0 4px 0 #d4b4aa;
            color: #5e3028;
        }
        .btn-shuffle {
            background: #d4d4e8;
            box-shadow: 0 4px 0 #b0b0c8;
            color: #2a2a3a;
        }
        .btn-flip {
            background: #e8dcc8;
            box-shadow: 0 4px 0 #cbbca4;
            color: #4a3f2e;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eae6e0;
            padding: 12px 20px;
            border-radius: 80px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 8px;
            font-weight: 500;
            color: #3b3834;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .stats span {
            background: #fcfaf7;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 0.95rem;
        }
        .add-section {
            background: #f2efe9;
            border-radius: 40px;
            padding: 20px 24px;
            margin-top: 28px;
            border: 1px solid rgba(255,255,255,0.6);
        }
        .add-section textarea {
            width: 100%;
            border: 2px solid #dbd4ca;
            border-radius: 30px;
            padding: 18px 20px;
            font-size: 1rem;
            background: #fcfaf7;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            transition: 0.15s;
            color: #1f1e1b;
        }
        .add-section textarea:focus {
            outline: none;
            border-color: #b3523a;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(179, 82, 58, 0.15);
        }
        .add-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 14px;
            margin-top: 18px;
        }
        .btn-add {
            background: #3d3a35;
            border: none;
            color: white;
            padding: 14px 34px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 #1f1e1b;
            transition: 0.08s linear;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #5b564f;
        }
        .btn-add:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #1f1e1b;
        }
        .btn-clear {
            background: #d1cbc2;
            border: none;
            color: #2b2825;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: 600;
            box-shadow: 0 4px 0 #b0a89d;
            transition: 0.08s linear;
            cursor: pointer;
        }
        .btn-clear:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #b0a89d;
        }
        .helper {
            font-size: 0.9rem;
            color: #6d6760;
            margin: 12px 0 4px 8px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .helper i { color: #b3523a; }
        .helper .badge {
            background: #b3523a;
            color: white;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .empty-state {
            color: #8c867d;
            font-size: 1.2rem;
            padding: 16px 0;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2b28;
            color: #f5f3f0;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; }
        .btn-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-bottom: 10px;
        }
        .congrats {
            font-size: 1.5rem;
            color: #2c2b28;
            padding: 20px;
        }
        @media (max-width: 550px) {
            .app-container { padding: 20px 16px; }
            .flashcard .word { font-size: 2.6rem; }
            .flashcard { padding: 30px 16px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <header>
        <h1><i class="fas fa-language"></i> Fiszki · Chiński</h1>
    </header>

    <div class="stats">
        <div><i class="fas fa-layer-group"></i> <span id="totalWords">0</span></div>
        <div><i class="fas fa-rotate-right"></i> do powtórzenia: <span id="repeatCount">0</span></div>
        <div><i class="fas fa-check-circle"></i> znane: <span id="knownCount">0</span></div>
        <div><i class="fas fa-random"></i> <span id="currentCardNum">0/0</span></div>
    </div>

    <div class="flashcard" id="flashcard">
        <div id="cardContent">
            <div class="empty-state"><i class="fas fa-plus-circle" style="margin-right: 8px;"></i> Dodaj słówka</div>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn-action" id="prevCardBtn"><i class="fas fa-arrow-left"></i> Poprzednia</button>
        <button class="btn-action" id="nextCardBtn"><i class="fas fa-arrow-right"></i> Następna</button>
        <button class="btn-action btn-shuffle" id="shuffleBtn"><i class="fas fa-random"></i> Potasuj</button>
    </div>
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin: 20px 0 12px;">
        <button class="btn-action btn-know" id="knowBtn"><i class="fas fa-check"></i> Znam</button>
        <button class="btn-action btn-dontknow" id="dontKnowBtn"><i class="fas fa-times"></i> Nie znam</button>
        <button class="btn-action btn-flip" id="flipCardBtn"><i class="fas fa-sync-alt"></i> Pokaż chiński</button>
    </div>

    <div class="add-section">
        <div class="helper">
            <i class="fas fa-robot"></i> 
            <span><strong>Inteligentne dodawanie</strong></span>
            <span class="badge">AI parser</span>
        </div>
        <textarea id="wordsInput" placeholder="Wklej słówka:&#10;你好 cześć&#10;谢谢 = dziękuję">你好 cześć
谢谢 dziękuję
再见 do widzenia
老师 nauczyciel
学生 uczeń
中国 Chiny
北京 Pekin
上海 Szanghaj
朋友 przyjaciel
家人 rodzina
电脑 komputer
手机 telefon
书店 księgarnia
医院 szpital
学校 szkoła
水 woda
茶 herbata
咖啡 kawa
你好吗? Jak się masz?
我爱你 Kocham Cię
谢谢 Dziękuję
对不起 Przepraszam
没关系 Nie ma sprawy</textarea>
        <div class="add-actions">
            <button class="btn-clear" id="clearAllBtn"><i class="fas fa-trash-alt"></i> Usuń wszystkie</button>
            <button class="btn-add" id="addWordsBtn"><i class="fas fa-plus-circle"></i> Dodaj wszystkie</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function(){
    "use strict";

    // ===================== STAN =====================
    let flashcards = [];
    let currentIndex = 0;
    let showingChinese = false;
    let nextId = 1;

    // ===================== DOM =====================
    const cardContent = document.getElementById('cardContent');
    const totalSpan = document.getElementById('totalWords');
    const repeatSpan = document.getElementById('repeatCount');
    const knownSpan = document.getElementById('knownCount');
    const currentCardNum = document.getElementById('currentCardNum');

    const prevBtn = document.getElementById('prevCardBtn');
    const nextBtn = document.getElementById('nextCardBtn');
    const flipBtn = document.getElementById('flipCardBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const knowBtn = document.getElementById('knowBtn');
    const dontKnowBtn = document.getElementById('dontKnowBtn');

    const wordsInput = document.getElementById('wordsInput');
    const addBtn = document.getElementById('addWordsBtn');
    const clearBtn = document.getElementById('clearAllBtn');
    const toast = document.getElementById('toast');
    const flashcard = document.getElementById('flashcard');

    let toastTimeout = null;

    // ===================== TOAST =====================
    function showToast(message, duration = 3000) {
        toast.textContent = message;
        toast.classList.add('show');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, duration);
    }

    // ===================== INTELIGENTNY PARSER =====================
    function isChinese(char) {
        const code = char.charCodeAt(0);
        return (code >= 0x4E00 && code <= 0x9FFF) ||
               (code >= 0x3400 && code <= 0x4DBF) ||
               (code >= 0x20000 && code <= 0x2A6DF) ||
               (code >= 0x2F800 && code <= 0x2FA1F) ||
               (code >= 0x3000 && code <= 0x303F) ||
               (code >= 0xFF00 && code <= 0xFFEF);
    }

    function isPolishLetter(char) {
        const code = char.charCodeAt(0);
        return (code >= 0x0041 && code <= 0x005A) ||
               (code >= 0x0061 && code <= 0x007A) ||
               'ąćęłńóśźżĄĆĘŁŃÓŚŹŻ'.includes(char);
    }

    function detectLanguage(text) {
        const chars = text.split('');
        let chineseCount = 0;
        let otherCount = 0;
        
        for (let ch of chars) {
            if (ch.trim() === '') continue;
            if (isChinese(ch)) {
                chineseCount++;
            } else {
                otherCount++;
            }
        }
        
        const total = chineseCount + otherCount;
        if (total === 0) return 'unknown';
        return (chineseCount / total > 0.3) ? 'chinese' : 'polish';
    }

    function intelligentSplit(line) {
        line = line.trim();
        if (!line) return null;

        const separators = [' = ', ' - ', ':', ';', '\t', '  '];
        for (let sep of separators) {
            if (line.includes(sep)) {
                const parts = line.split(sep);
                if (parts.length === 2) {
                    let left = parts[0].trim();
                    let right = parts[1].trim();
                    if (left && right) {
                        const langLeft = detectLanguage(left);
                        const langRight = detectLanguage(right);
                        
                        if (langLeft === 'chinese' && langRight === 'polish') {
                            return { chinese: left, polish: right };
                        } else if (langLeft === 'polish' && langRight === 'chinese') {
                            return { chinese: right, polish: left };
                        } else if (langLeft === 'chinese') {
                            return { chinese: left, polish: right };
                        } else if (langRight === 'chinese') {
                            return { chinese: right, polish: left };
                        } else {
                            return { chinese: left, polish: right };
                        }
                    }
                }
            }
        }

        const words = line.split(/\s+/);
        if (words.length < 2) return null;

        let bestSplit = -1;
        let bestScore = -1;

        for (let i = 1; i < words.length; i++) {
            const left = words.slice(0, i).join(' ');
            const right = words.slice(i).join(' ');
            
            const langLeft = detectLanguage(left);
            const langRight = detectLanguage(right);
            
            let score = 0;
            if (langLeft === 'chinese') score += 3;
            if (langRight === 'polish') score += 3;
            if (isChinese(left[0])) score += 2;
            if (isPolishLetter(right[0]) || right[0]?.match(/[a-zA-Z]/)) score += 2;
            
            if (score > bestScore) {
                bestScore = score;
                bestSplit = i;
            }
        }

        if (bestSplit > 0) {
            let chinesePart = words.slice(0, bestSplit).join(' ');
            let polishPart = words.slice(bestSplit).join(' ');
            
            if (detectLanguage(chinesePart) === 'chinese' || isChinese(chinesePart[0])) {
                return { chinese: chinesePart, polish: polishPart };
            } else if (detectLanguage(polishPart) === 'chinese' || isChinese(polishPart[0])) {
                return { chinese: polishPart, polish: chinesePart };
            }
        }

        if (words.length === 2) {
            const lang1 = detectLanguage(words[0]);
            const lang2 = detectLanguage(words[1]);
            
            if (lang1 === 'chinese' || isChinese(words[0][0])) {
                return { chinese: words[0], polish: words[1] };
            } else if (lang2 === 'chinese' || isChinese(words[1][0])) {
                return { chinese: words[1], polish: words[0] };
            }
        }

        return null;
    }

    function parseWordsFromText(text) {
        const lines = text.split(/\r?\n/);
        const result = [];
        const seen = new Set();

        for (let line of lines) {
            line = line.trim();
            if (!line) continue;

            const parsed = intelligentSplit(line);
            if (parsed && parsed.chinese && parsed.polish) {
                const key = `${parsed.chinese}|${parsed.polish}`;
                if (!seen.has(key)) {
                    seen.add(key);
                    result.push(parsed);
                }
            }
        }

        return result;
    }

    // ===================== FUNKCJE POMOCNICZE =====================
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function getActiveCards() {
        // Zwraca TYLKO słowa, które NIE są znane (do powtórzenia)
        return flashcards.filter(f => f.known === false);
    }

    function updateStats() {
        const total = flashcards.length;
        const known = flashcards.filter(f => f.known === true).length;
        const toRepeat = flashcards.filter(f => f.known === false).length;
        totalSpan.textContent = total;
        knownSpan.textContent = known;
        repeatSpan.textContent = toRepeat;
        
        if (total > 0) {
            currentCardNum.textContent = `${currentIndex + 1}/${total}`;
        } else {
            currentCardNum.textContent = '0/0';
        }
    }

    function saveToLocalStorage() {
        try {
            const data = {
                flashcards: flashcards,
                nextId: nextId,
                currentIndex: currentIndex,
                showingChinese: showingChinese
            };
            localStorage.setItem('chineseFlashcardsData', JSON.stringify(data));
        } catch (e) {}
    }

    function loadFromLocalStorage() {
        try {
            const raw = localStorage.getItem('chineseFlashcardsData');
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (data.flashcards && Array.isArray(data.flashcards)) {
                flashcards = data.flashcards;
                nextId = data.nextId || 1;
                currentIndex = (typeof data.currentIndex === 'number' && data.currentIndex < flashcards.length) ? data.currentIndex : 0;
                showingChinese = data.showingChinese === true;
                return true;
            }
            return false;
        } catch (e) {
            return false;
        }
    }

    // ===================== RENDER FISZKI =====================
    function renderCard() {
        // Sprawdź czy są jakieś słówka do powtórzenia (nieznane)
        const activeCards = getActiveCards();
        
        if (flashcards.length === 0) {
            cardContent.innerHTML = `<div class="empty-state"><i class="fas fa-plus-circle" style="margin-right: 8px;"></i> Dodaj słówka, aby zacząć</div>`;
            updateStats();
            return;
        }

        // Jeśli wszystkie słówka są znane – gratulacje!
        if (activeCards.length === 0 && flashcards.length > 0) {
            cardContent.innerHTML = `
                <div class="congrats">
                    <i class="fas fa-trophy" style="color: #b3523a; font-size: 3rem; display: block; margin-bottom: 16px;"></i>
                    <div style="font-size: 2rem; font-weight: 600;">🎉 Wszystkie słówka znane!</div>
                    <div style="font-size: 1.2rem; color: #7f7a72; margin-top: 12px;">
                        Nauczyłeś się wszystkich ${flashcards.length} słówek!
                    </div>
                    <div style="font-size: 1rem; color: #7f7a72; margin-top: 8px;">
                        Dodaj nowe słówka lub zresetuj stan
                    </div>
                </div>
            `;
            updateStats();
            return;
        }

        // Zabezpieczenie – jeśli currentIndex wskazuje na znane słowo, przesuń na pierwsze nieznane
        if (currentIndex < flashcards.length && flashcards[currentIndex].known === true) {
            // Znajdź pierwsze nieznane słowo
            const firstUnknown = flashcards.findIndex(f => f.known === false);
            if (firstUnknown !== -1) {
                currentIndex = firstUnknown;
            } else {
                // Wszystkie znane – ale to już obsłużyliśmy wyżej
                currentIndex = 0;
            }
        }

        if (currentIndex >= flashcards.length) currentIndex = 0;
        if (currentIndex < 0) currentIndex = 0;

        const card = flashcards[currentIndex];
        if (!card) {
            cardContent.innerHTML = `<div class="empty-state">Błąd</div>`;
            return;
        }

        let displayWord = '';
        let displayHint = '';
        let audioText = '';
        let sideLabel = '';
        let statusBadge = '';

        if (!showingChinese) {
            // ===== STRONA POLSKA =====
            displayWord = card.polish || '(brak)';
            displayHint = 'Kliknij lub "Pokaż chiński"';
            audioText = '';
            sideLabel = '🇵🇱 POLSKI';
        } else {
            // ===== STRONA CHIŃSKA =====
            displayWord = card.chinese || '(brak)';
            displayHint = `🇵🇱 ${card.polish || ''}`;
            audioText = card.chinese || '';
            sideLabel = '🀄 CHIŃSKI';
        }

        // Status słówka
        statusBadge = card.known ? '✅ znane' : '🔄 do powtórzenia';

        const audioBtnHtml = showingChinese ? `
            <button class="audio-btn" id="speakBtn"><i class="fas fa-volume-up"></i> Odsłuchaj</button>
        ` : '';

        cardContent.innerHTML = `
            <div class="side-label">${sideLabel}</div>
            <div class="card-number">${currentIndex + 1}/${flashcards.length}</div>
            <div class="status-badge">${statusBadge}</div>
            <div class="word">${displayWord}</div>
            <div class="translation-hint">${displayHint}</div>
            ${audioBtnHtml}
        `;

        const speakBtn = document.getElementById('speakBtn');
        if (speakBtn) {
            speakBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(audioText);
                    utterance.lang = 'zh-CN';
                    utterance.rate = 0.8;
                    utterance.pitch = 1.0;
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.speak(utterance);
                } else {
                    alert('Synteza mowy niedostępna');
                }
            });
        }

        updateStats();
        saveToLocalStorage();
    }

    // ===================== AKCJE =====================
    function goToPrev() {
        if (flashcards.length === 0) return;
        
        // Szukamy poprzedniego NIEZNANEGO słówka
        let newIndex = currentIndex - 1;
        let attempts = 0;
        while (attempts < flashcards.length) {
            if (newIndex < 0) newIndex = flashcards.length - 1;
            if (!flashcards[newIndex].known) {
                currentIndex = newIndex;
                break;
            }
            newIndex--;
            attempts++;
        }
        
        showingChinese = false;
        renderCard();
    }

    function goToNext() {
        if (flashcards.length === 0) return;
        
        // Szukamy następnego NIEZNANEGO słówka
        let newIndex = currentIndex + 1;
        let attempts = 0;
        while (attempts < flashcards.length) {
            if (newIndex >= flashcards.length) newIndex = 0;
            if (!flashcards[newIndex].known) {
                currentIndex = newIndex;
                break;
            }
            newIndex++;
            attempts++;
        }
        
        showingChinese = false;
        renderCard();
    }

    function flipCard() {
        if (flashcards.length === 0) return;
        showingChinese = !showingChinese;
        renderCard();
    }

    function shuffleCards() {
        const activeCards = getActiveCards();
        if (activeCards.length < 2) {
            showToast('Potrzebujesz co najmniej 2 słówka do powtórzenia', 2000);
            return;
        }
        
        // Tasujemy TYLKO nieznane słówka
        const unknownIndices = [];
        flashcards.forEach((f, i) => {
            if (!f.known) unknownIndices.push(i);
        });
        
        // Tasujemy indeksy nieznanych
        for (let i = unknownIndices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [unknownIndices[i], unknownIndices[j]] = [unknownIndices[j], unknownIndices[i]];
        }
        
        // Przestawiamy flashcards tak, aby nieznane były w nowej kolejności
        const newFlashcards = [];
        const unknownCards = unknownIndices.map(idx => flashcards[idx]);
        const knownCards = flashcards.filter(f => f.known);
        
        // Najpierw nieznane (potasowane), potem znane na końcu
        newFlashcards.push(...unknownCards);
        newFlashcards.push(...knownCards);
        
        flashcards = newFlashcards;
        currentIndex = 0;
        showingChinese = false;
        renderCard();
        showToast('🃏 Potasowano nieznane słówka!', 1500);
    }

    function markKnown() {
        if (flashcards.length === 0) return;
        const card = flashcards[currentIndex];
        if (!card) return;
        
        card.known = true;
        showingChinese = false;
        saveToLocalStorage();
        
        // Przechodzimy do następnego NIEZNANEGO słówka
        let newIndex = currentIndex + 1;
        let attempts = 0;
        let found = false;
        while (attempts < flashcards.length) {
            if (newIndex >= flashcards.length) newIndex = 0;
            if (!flashcards[newIndex].known) {
                currentIndex = newIndex;
                found = true;
                break;
            }
            newIndex++;
            attempts++;
        }
        
        // Jeśli wszystkie są znane, zostajemy na tym samym indeksie
        if (!found) {
            // Wszystkie znane – pokażemy komunikat w renderze
            currentIndex = 0;
        }
        
        renderCard();
    }

    function markDontKnow() {
        if (flashcards.length === 0) return;
        const card = flashcards[currentIndex];
        if (!card) return;
        
        card.known = false;
        showingChinese = false;
        saveToLocalStorage();
        
        // Przechodzimy do następnego NIEZNANEGO słówka
        let newIndex = currentIndex + 1;
        let attempts = 0;
        let found = false;
        while (attempts < flashcards.length) {
            if (newIndex >= flashcards.length) newIndex = 0;
            if (!flashcards[newIndex].known) {
                currentIndex = newIndex;
                found = true;
                break;
            }
            newIndex++;
            attempts++;
        }
        
        if (!found) {
            // Wszystkie znane
            currentIndex = 0;
        }
        
        renderCard();
    }

    // Kliknięcie na fiszkę = odwróć
    flashcard.addEventListener('click', function(e) {
        if (e.target.closest('.audio-btn')) return;
        if (flashcards.length === 0) return;
        showingChinese = !showingChinese;
        renderCard();
    });

    // ===================== DODAWANIE SŁÓWEK =====================
    function addWordsFromInput() {
        const text = wordsInput.value;
        const parsed = parseWordsFromText(text);
        
        if (parsed.length === 0) {
            showToast('⚠️ Nie znaleziono poprawnych par', 3500);
            return;
        }

        const beforeCount = flashcards.length;
        let addedCount = 0;
        
        for (let item of parsed) {
            const exists = flashcards.some(f => 
                f.chinese === item.chinese && f.polish === item.polish
            );
            if (!exists) {
                flashcards.push({
                    id: nextId++,
                    chinese: item.chinese,
                    polish: item.polish,
                    known: false, // Nowe słówka zawsze NIEZNANE
                });
                addedCount++;
            }
        }

        if (addedCount === 0) {
            showToast(`ℹ️ Wszystkie ${parsed.length} słówek już istnieją`, 2500);
        } else {
            showToast(`✅ Dodano ${addedCount} nowych (łącznie ${flashcards.length})`, 3000);
            // Tasujemy TYLKO nieznane słówka
            const unknownIndices = [];
            flashcards.forEach((f, i) => {
                if (!f.known) unknownIndices.push(i);
            });
            
            if (unknownIndices.length > 1) {
                // Tasujemy nieznane
                for (let i = unknownIndices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [unknownIndices[i], unknownIndices[j]] = [unknownIndices[j], unknownIndices[i]];
                }
                
                const newFlashcards = [];
                const unknownCards = unknownIndices.map(idx => flashcards[idx]);
                const knownCards = flashcards.filter(f => f.known);
                newFlashcards.push(...unknownCards);
                newFlashcards.push(...knownCards);
                flashcards = newFlashcards;
            }
        }

        currentIndex = 0;
        showingChinese = false;
        renderCard();
    }

    function clearAllWords() {
        if (flashcards.length === 0) return;
        if (confirm('Usunąć wszystkie słówka?')) {
            flashcards = [];
            currentIndex = 0;
            showingChinese = false;
            renderCard();
            saveToLocalStorage();
            showToast('🗑️ Usunięto wszystkie', 2000);
        }
    }

    // ===================== INIT =====================
    function init() {
        const loaded = loadFromLocalStorage();
        if (!loaded) {
            const defaultText = wordsInput.value;
            const parsed = parseWordsFromText(defaultText);
            for (let item of parsed) {
                flashcards.push({
                    id: nextId++,
                    chinese: item.chinese,
                    polish: item.polish,
                    known: false,
                });
            }
            
            // Tasujemy nieznane na start
            const unknownIndices = [];
            flashcards.forEach((f, i) => {
                if (!f.known) unknownIndices.push(i);
            });
            
            if (unknownIndices.length > 1) {
                for (let i = unknownIndices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [unknownIndices[i], unknownIndices[j]] = [unknownIndices[j], unknownIndices[i]];
                }
                const newFlashcards = [];
                const unknownCards = unknownIndices.map(idx => flashcards[idx]);
                const knownCards = flashcards.filter(f => f.known);
                newFlashcards.push(...unknownCards);
                newFlashcards.push(...knownCards);
                flashcards = newFlashcards;
            }
            
            currentIndex = 0;
            showingChinese = false;
        }
        renderCard();

        // Eventy
        prevBtn.addEventListener('click', goToPrev);
        nextBtn.addEventListener('click', goToNext);
        flipBtn.addEventListener('click', flipCard);
        shuffleBtn.addEventListener('click', shuffleCards);
        knowBtn.addEventListener('click', markKnown);
        dontKnowBtn.addEventListener('click', markDontKnow);
        addBtn.addEventListener('click', addWordsFromInput);
        clearBtn.addEventListener('click', clearAllWords);

        // Ctrl+Enter = dodaj
        wordsInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                addWordsFromInput();
            }
        });

        // Skróty klawiszowe
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowLeft') { e.preventDefault(); goToPrev(); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); goToNext(); }
            else if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); flipCard(); }
            else if (e.key === 'k' || e.key === 'K') { e.preventDefault(); markKnown(); }
            else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); markDontKnow(); }
            else if (e.key === 's' || e.key === 'S') { e.preventDefault(); shuffleCards(); }
        });

        if (flashcards.length > 0) {
            const unknownCount = flashcards.filter(f => !f.known).length;
            showToast(`📚 ${flashcards.length} słówek (${unknownCount} do powtórzenia)`, 2000);
        }
    }

    init();
})();
</script>
</body>
</html>
